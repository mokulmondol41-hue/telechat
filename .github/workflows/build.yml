name: Build Debug APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        id: build
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build-log.txt
        continue-on-error: true

      - name: Upload APK artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Push build log to ci-logs branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/logpush
          cp build-log.txt /tmp/logpush/build-log.txt
          echo "${{ steps.build.outcome }}" > /tmp/logpush/status.txt
          echo "${{ github.sha }}" > /tmp/logpush/commit.txt
          git checkout --orphan ci-logs
          git rm -rf . > /dev/null 2>&1 || true
          cp /tmp/logpush/build-log.txt .
          cp /tmp/logpush/status.txt .
          cp /tmp/logpush/commit.txt .
          git add build-log.txt status.txt commit.txt
          git commit -m "CI log for ${{ github.sha }}"
          git push --force origin ci-logs

      - name: Push APK to apk-releases branch
        if: steps.build.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/apkpush
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/apkpush/app-debug.apk
          git checkout main -- .
          git checkout --orphan apk-releases
          git rm -rf . > /dev/null 2>&1 || true
          cp /tmp/apkpush/app-debug.apk .
          git add app-debug.apk
          git commit -m "APK build for ${{ github.sha }}"
          git push --force origin apk-releases

      - name: Fail job if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1
